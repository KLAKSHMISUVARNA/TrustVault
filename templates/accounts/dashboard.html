<!DOCTYPE html>
<html>
<head>
    <title>TrustVault Dashboard</title>
</head>
<body>

<h1>Welcome to TrustVault</h1>

<p>Username: {{ request.user.username }}</p>

<p>Role: {{ request.user.get_role_display }}</p>

</form>

</body>
</html>
