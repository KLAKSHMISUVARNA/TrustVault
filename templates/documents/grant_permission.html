<!DOCTYPE html>
<html>
<head>
    <title>Grant Permission | TrustVault</title>
</head>
<body>

<h2>Grant Document Access</h2>

<h3>{{ document.title }}</h3>

<form method="POST">

</form>

    Manage Permissions
</a>

</body>
</html>
